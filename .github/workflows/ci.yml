name: CI

on:
  push:
    branches: [main, chore/v4-baseline]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt -r pro/requirements.txt
      - run: python -m pytest tests/contracts tests/unit tests/integration -q
      - run: python -m ruff check tests scripts bench

  blender-cross-platform:
    name: Blender headless (${{ matrix.os }}, experimental)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: blender-5.2.4-windows-x64.zip
            sha: bbd78f8931dc940444da4ff2983374930f9f5c092ae0e330588e9760bb9d967c
          - os: macos-15
            artifact: blender-5.2.4-macos-arm64.dmg
            sha: e73d564f97061b2496ccc5a0bd738937d2d3d0acae23621a00bbc7534dfd135f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify Blender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\blender.zip"
          foreach ($mirror in @("https://ftp.nluug.nl/graphics/blender", "https://mirror.clarkson.edu/blender", "https://download.blender.org")) {
            try {
              Invoke-WebRequest -Uri "$mirror/release/Blender5.2/${{ matrix.artifact }}" -OutFile $zip -TimeoutSec 180
            } catch {
              Write-Warning "Download from $mirror failed: $_"
              continue
            }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne "${{ matrix.sha }}") {
              Write-Warning "Blender checksum mismatch on $mirror"
              continue
            }
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
            exit 0
          }
          throw "No Blender mirror returned the expected archive checksum"
      - name: Run Blender headless (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BLENDER_MCP_TEST_SKIP_RENDER: "1"
        run: |
          & "$env:RUNNER_TEMP\blender-5.2.4-windows-x64\blender.exe" -b --factory-startup --python-exit-code 1 --python tests/blender/import_headless.py
      - name: Download and verify Blender (macOS)
        if: runner.os == 'macOS'
        run: |
          archive="$RUNNER_TEMP/blender.dmg"
          verified=false
          for mirror in https://ftp.nluug.nl/graphics/blender https://mirror.clarkson.edu/blender https://download.blender.org; do
            if curl -fsSL --connect-timeout 15 --max-time 180 -o "$archive" "$mirror/release/Blender5.2/${{ matrix.artifact }}" &&
               echo "${{ matrix.sha }}  $archive" | shasum -a 256 -c -; then
              verified=true
              break
            fi
          done
          if [[ "$verified" != true ]]; then
            echo "No Blender mirror returned the expected archive checksum" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/blender-mount"
          hdiutil attach "$archive" -nobrowse -mountpoint "$RUNNER_TEMP/blender-mount"
      - name: Run Blender headless (macOS)
        if: runner.os == 'macOS'
        run: |
          "$RUNNER_TEMP/blender-mount/Blender.app/Contents/MacOS/Blender" -b --factory-startup --python-exit-code 1 --python tests/blender/import_headless.py
      - name: Detach Blender (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if mount | grep -Fq "$RUNNER_TEMP/blender-mount"; then
            hdiutil detach "$RUNNER_TEMP/blender-mount"
          fi

  blender:
    name: Blender ${{ matrix.version }} LTS (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4.5.4"
            dir: "blender-4.5.4-linux-x64"
            sha: "2e6ef8e99fc36327270429ddc8e7bad2859dd878a5a137d2e0bf0f02f6792505"
          - version: "5.2.4"
            dir: "blender-5.2.4-linux-x64"
            sha: "2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libglu1-mesa
      - name: Download Blender ${{ matrix.version }}
        run: |
          archive="$RUNNER_TEMP/blender.tar.xz"
          file="release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          for mirror in https://ftp.nluug.nl/graphics/blender https://mirror.clarkson.edu/blender https://download.blender.org; do
            if curl -fsSL --retry 2 --connect-timeout 15 --max-time 180 -o "$archive" "$mirror/$file" &&
               echo "${BLENDER_SHA}  $archive" | sha256sum -c -; then
              tar -xJf "$archive" -C "$RUNNER_TEMP"
              exit 0
            fi
          done
          echo "No Blender mirror returned the expected archive checksum" >&2
          exit 1
        env:
          BLENDER_VERSION: ${{ matrix.version }}
          BLENDER_SERIES: ${{ startsWith(matrix.version, '4.') && '4.5' || '5.2' }}
          BLENDER_SHA: ${{ matrix.sha }}
      - name: Install bridge dependency
        run: python -m pip install -r pro/requirements.txt
      - name: Run real Blender tests
        timeout-minutes: 5
        env:
          BLENDER_BIN: ${{ runner.temp }}/${{ matrix.dir }}/blender
        run: ./scripts/run_blender_tests.sh
      - name: Build and reopen both showcase scenes
        env:
          BLENDER_BIN: ${{ runner.temp }}/${{ matrix.dir }}/blender
        run: |
          "$BLENDER_BIN" -b --factory-startup --python-exit-code 1 -t 4 \
            --python scripts/render_showcase.py -- --check-only --output "$RUNNER_TEMP/pelagos-showcase"
          "$BLENDER_BIN" -b --factory-startup --python-exit-code 1 -t 4 \
            --python scripts/render_pilot_showcase.py -- --check-only --output "$RUNNER_TEMP/nereid-showcase"
          "$BLENDER_BIN" -b --factory-startup --python-exit-code 1 -t 4 \
            --python tests/blender/check_showcase.py
      - name: Run BlenderMCP-Bench
        env:
          BLENDER_BIN: ${{ runner.temp }}/${{ matrix.dir }}/blender
        run: ./scripts/run_bench.sh --runs 1 --output bench/results/ci-${{ matrix.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blender-mcp-bench-${{ matrix.version }}
          path: bench/results/ci-${{ matrix.version }}
      - name: Build, install and test the extension
        timeout-minutes: 5
        env:
          BLENDER_BIN: ${{ runner.temp }}/${{ matrix.dir }}/blender
          BLENDER_MCP_TEST_INSTALLED_EXTENSION: "1"
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/blender-extension-profile
          BLENDER_MCP_TOKEN_FILE: ${{ runner.temp }}/blender-extension-profile/token
        run: |
          BUILD_DIR="$RUNNER_TEMP/blender-extension" ./scripts/build_extension.sh
          archives=("$RUNNER_TEMP/blender-extension"/blender_mcp_pro-*.zip)
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}"
          "$BLENDER_BIN" --factory-startup --command extension validate "${archives[0]}"
          mkdir -p "$BLENDER_USER_RESOURCES"
          "$BLENDER_BIN" -b --factory-startup --command extension install-file \
            --repo user_default --enable "${archives[0]}"
          xvfb-run -a "$BLENDER_BIN" --python-exit-code 1 --python tests/blender/smoke_gui.py \
            | tee "$RUNNER_TEMP/blender-extension.log"
          grep -q 'BLENDER_GUI_TEST_OK' "$RUNNER_TEMP/blender-extension.log"
