[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-mcp"
version = "4.3.0a1"
description = "MCP bridge for the Blender MCP Pro add-on"
requires-python = ">=3.10"
dependencies = ["mcp==1.30.0", "PyJWT>=2.15.0,<3"]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/contracts", "tests/unit", "tests/integration"]
pythonpath = ["src", "pro"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["pro/blender_mcp.py", "src/blender_mcp/server.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
